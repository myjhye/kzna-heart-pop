# main 에 푸시하면 Cloudflare Pages 로 자동 배포
#
# 최초 1회 설정 (GitHub 저장소 → Settings → Secrets and variables → Actions → New repository secret)
#   CLOUDFLARE_API_TOKEN   : Cloudflare 대시보드 → My Profile → API Tokens → Create Token
#                            → "Edit Cloudflare Workers" 템플릿 (Cloudflare Pages: Edit 권한 포함)
#   CLOUDFLARE_ACCOUNT_ID  : Cloudflare 대시보드 → Workers & Pages 화면 오른쪽의 Account ID
#
# 시크릿이 없으면 배포 단계는 건너뛰고 성공으로 끝난다.
# 배포 주소: https://kzna-heart-pop.pages.dev
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: kzna-heart-pop
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 배포를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site folder
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p dist
          cp -r index.html css js vendor assets _headers dist/

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Create Pages project (first run only)
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@3 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
